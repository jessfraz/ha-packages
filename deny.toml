[advisories]
yanked = "deny"
# Upstream libraries choose their transitive dependencies. Maintenance failures
# still block direct dependencies; vulnerabilities are checked throughout.
unmaintained = "workspace"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
