name: Packages
version: "0.8.2"
slug: packages
description: A local shipment registry with a Home Assistant dashboard
url: https://github.com/jessfraz/ha-packages
arch:
  - amd64
  - aarch64
image: ghcr.io/jessfraz/ha-packages
startup: application
boot: auto
backup: cold
timeout: 120
init: false
ingress: true
ingress_port: 8099
panel_admin: false
panel_icon: mdi:package-variant-closed
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Bearer-authenticated API for the integration and external clients
environment:
  PACKAGES_ENABLE_INGRESS: "true"
options: {}
schema:
  easypost_api_key: password?
  aftership_api_key: password?
  pickup_usps_client_id: str?
  pickup_usps_client_secret: password?
  pickup_usps_environment: list(sandbox|production)?
  pickup_ups_client_id: str?
  pickup_ups_client_secret: password?
  pickup_ups_account_number: str?
  pickup_ups_environment: list(sandbox|production)?
  pickup_fedex_client_id: str?
  pickup_fedex_client_secret: password?
  pickup_fedex_account_number: str?
  pickup_fedex_environment: list(sandbox|production)?
discovery:
  - packages
