[project]
name = "shipments-home-assistant"
version = "0.6.12"
description = "Home Assistant adapter for the Shipments service"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "gazetteer-matcher==1.2.0",
  "hassil==3.12.1",
  "home-assistant-frontend==20260930.5",
  "home-assistant-intents==2026.10.6",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff==0.17.2",
  "ty==0.0.91",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests_ha"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ty.src]
include = ["custom_components", "tests_ha"]

[tool.uv]
package = false
