[project]
name = "packages-home-assistant"
version = "0.8.11"
description = "Home Assistant adapter for the Packages service"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "aiohasupervisor==0.10.0",
  "gazetteer-matcher==1.2.0",
  "hassil==3.12.1",
  "home-assistant-frontend==20261028.5",
  "home-assistant-intents==2026.10.27",
  "pytest-homeassistant==2026.11.0",
  "ruff==0.17.4",
  "ty==0.0.99",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests_ha"]
addopts = "--strict-markers -p no:respx"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ty.src]
include = ["custom_components", "tests_ha"]

[tool.uv]
package = false
