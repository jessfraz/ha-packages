[package]
name = "packages"
default-run = "packages"
version = "0.8.7"
edition = "2024"
license = "MIT AND Apache-2.0"
description = "A local shipment registry for Home Assistant"
repository = "https://github.com/jessfraz/ha-packages"

[dependencies]
ha-app-ui = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.5" }
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
dropshot = "0.18"
getrandom = "0.4"
http = "1"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip"] }
scraper = "0.29"
schemars = { version = "0.8", features = ["uuid1"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slog = "2"
# Temporary upstream pin: registry 0.9.0 excludes the SQLite fix for RUSTSEC-2026-0459.
# Return to a registry release once it permits libsqlite3-sys >=0.39.0.
sqlx = { version = "0.9", git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
ha-app-kit-ha = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.5" }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
expectorate = "1"
