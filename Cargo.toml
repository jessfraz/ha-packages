[package]
name = "shipments"
version = "0.6.27"
edition = "2024"
license = "MIT AND Apache-2.0"
description = "A local shipment registry for Home Assistant"
repository = "https://github.com/jessfraz/ha-packages"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dropshot = "0.17"
getrandom = "0.4"
http = "1"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip"] }
scraper = "0.24"
schemars = { version = "1.2", features = ["uuid1"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slog = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
expectorate = "1"
